name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# 成本拆分：编译在 GitHub 托管 runner 上完成，Blacksmith 只下载 nextest
# archive 并执行测试，避免把有限的 Blacksmith 分钟花在编译上。
#
# - lint: fmt / clippy / orphan（ubuntu-latest）
# - build-*: cargo nextest archive（ubuntu-latest / ubuntu-24.04-arm）
# - test-*: 下载 archive，cargo nextest run --archive-file（Blacksmith）
# - test-macos: macOS 无法跨平台复用 archive，保留原生的 build+test
# - s3-*: RustFS 集成测试需要本机编译，留在 GitHub 托管 runner
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/install.sh
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ./tool/orphan.sh

  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/install.sh
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # rust-cache 只按 Cargo.lock 复用 target；这两个包的测试对 manifest 对齐
      # 敏感，强制从当前源码重建，避免缓存里旧对象造成跨机器结果不一致。
      - run: cargo clean -p fkv_manifest -p fkv_task_reopen
      - name: build nextest archive
        run: |
          cargo nextest archive --workspace --all-features \
            --archive-file "fkv-tests-${{ matrix.arch }}.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: fkv-tests-${{ matrix.arch }}
          path: fkv-tests-${{ matrix.arch }}.tar.zst
          retention-days: 1

  test:
    name: test-${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: blacksmith-4vcpu-ubuntu-2604
          - arch: aarch64
            runner: blacksmith-4vcpu-ubuntu-2604-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v7
        with:
          name: fkv-tests-${{ matrix.arch }}
          path: .
      - name: run nextest archive
        run: |
          # Blacksmith 的 /tmp 较小，archive 解压到 workspace 所在磁盘。
          mkdir -p "${{ github.workspace }}/.nextest-archive"
          cargo nextest run \
            --archive-file "fkv-tests-${{ matrix.arch }}.tar.zst" \
            --workspace-remap "${{ github.workspace }}" \
            --extract-to "${{ github.workspace }}/.nextest-archive" \
            --extract-overwrite \
            --no-fail-fast --no-tests=pass

  test-macos:
    name: test-macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo clean -p fkv_manifest -p fkv_task_reopen
      - run: cargo nextest run --workspace --all-features --no-tests=pass

  s3:
    name: s3-rustfs-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # 原生依赖 + 原生 RustFS；脚本负责下载、启动，并把 EKV_S3_* 写入 $GITHUB_ENV。
      - run: bash scripts/ci/install.sh
      - run: bash scripts/ci/s3.sh start
      - name: S3 integration tests
        run: cargo nextest run -p fkv_cloud -p fkv_object_s3 -p fkv_runtime --all-features --no-tests=pass
      - name: Stop RustFS
        if: always()
        run: bash scripts/ci/s3.sh stop
