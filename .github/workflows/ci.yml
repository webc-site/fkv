name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 所有编译与测试都在 GitHub 托管 runner 上原生执行。
#
# 不把测试二进制作为 artifact 传给 Blacksmith：全量 nextest archive 约 4.9 GB，
# 上传/下载比测试本身还慢，也会消耗 Blacksmith 分钟。Blacksmith 仅在需要更快
# 的交互式运行时通过 workflow_dispatch / 自定义 workflow 使用。
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/install.sh
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-archive
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ./tool/orphan.sh

  test:
    name: test-${{ matrix.os }}
    # 只影响 CI 构建体积/速度；测试二进制不保留 DWARF，panic 仍有测试名与断言。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          # macOS 专属 buffered IO / OS 页大小 16 KiB 路径需要独立回归。
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # 幂等安装 Linux 构建依赖（clang/cmake/liburing 等）；非 Linux 自动 skip。
      - run: bash scripts/ci/install.sh
      - name: assert 4 KiB page (Linux)
        if: runner.os == 'Linux'
        run: test "$(getconf PAGESIZE)" = 4096
      - uses: dtolnay/rust-toolchain@nightly
      # 旧的 nextest archive 实验把数 GB 测试二进制留在了 target/build/out；
      # 换 key 避免继续复用被污染的缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-archive
      - name: free stale build outputs
        run: |
          df -h .
          rm -rf target/debug/incremental
          find target/debug/build -type f -path '*/out/*' -size +10M -delete 2>/dev/null || true
          df -h .
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # rust-cache 只按 Cargo.lock 复用 target；这两个包的测试对 manifest 对齐
      # 敏感，强制从当前源码重建，避免缓存里旧对象造成跨机器结果不一致。
      - run: cargo clean -p fkv_manifest -p fkv_task_reopen
      # NVMe 专用测试由 nvme.yml 单独构建/运行，避免重复执行。
      - run: cargo nextest run --workspace --exclude fkv_nvme_test --all-features --no-tests=pass

  s3:
    name: s3-rustfs-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-archive
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # 原生依赖 + 原生 RustFS；脚本负责下载、启动，并把 EKV_S3_* 写入 $GITHUB_ENV。
      - run: bash scripts/ci/install.sh
      - run: bash scripts/ci/s3.sh start
      - name: S3 integration tests
        run: cargo nextest run -p fkv_cloud -p fkv_object_s3 -p fkv_runtime --all-features --no-tests=pass
      - name: Stop RustFS
        if: always()
        run: bash scripts/ci/s3.sh stop
