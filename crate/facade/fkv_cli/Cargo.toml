[package]
name = "fkv_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "bench 与检查工具"

[[bin]]
name = "fkv"
path = "src/main.rs"

[dependencies]
clap_args = { version = "0.1.9", features = ["macro"] }
compio = { version = "0.19.2", features = ["runtime", "fs", "io", "macros", "time"] }
fkv_config = { version = "0.1.0", path = "../../foundation/fkv_config" }
fkv_error = { version = "0.1.0", path = "../../foundation/fkv_error" }
fkv_sdk = { version = "0.1.0", path = "../fkv_sdk" }
fkv_types = { version = "0.1.0", path = "../../foundation/fkv_types" }
rusty_alloc_default = "0.1.4"
