[package]
name = "fkv_sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "put/get/delete/scan 便捷 API"

[dependencies]
fkv_btree = { version = "0.1.0", path = "../../core/fkv_btree" }
fkv_config = { version = "0.1.0", path = "../../foundation/fkv_config" }
fkv_error = { version = "0.1.0", path = "../../foundation/fkv_error" }
fkv_io_compio = { version = "0.1.0", path = "../../io/fkv_io_compio" }
fkv_large = { version = "0.1.0", path = "../../core/fkv_large" }
fkv_store = { version = "0.1.0", path = "../../engine/fkv_store" }
fkv_types = { version = "0.1.0", path = "../../foundation/fkv_types" }

[dev-dependencies]
compio = { version = "0.19.2", features = ["runtime", "fs", "io", "macros", "time"] }
fkv_testkit = { path = "../fkv_testkit" }
