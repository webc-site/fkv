[package]
name = "fkv_large"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "segment mapping、大 value 编码、metadata trailer、读写计划"

[dependencies]
fkv_buf = { version = "0.1.0", path = "../fkv_buf" }
fkv_codec = { version = "0.1.0", path = "../../foundation/fkv_codec" }
fkv_error = { version = "0.1.0", path = "../../foundation/fkv_error" }
fkv_io = { version = "0.1.0", path = "../../io/fkv_io" }
fkv_mapping = { version = "0.1.0", path = "../fkv_mapping" }
fkv_types = { version = "0.1.0", path = "../../foundation/fkv_types" }

[dev-dependencies]
compio = { version = "0.19.2", features = ["fs", "io", "macros"] }
fkv_io_compio = { path = "../../io/fkv_io_compio" }
fkv_io_mem = { path = "../../io/fkv_io_mem" }
fkv_page = { path = "../../format/fkv_page" }
pollster = "1.0.1"
