[package]
name = "fkv_bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "性能评测：gxhash 微基准 + 端到端 workload"

[dependencies]
clap_args = { version = "0.1.9", features = ["macro"] }
fkv_types = { version = "0.1.0", path = "../../foundation/fkv_types" }
fkv_store = { version = "0.1.0", path = "../../engine/fkv_store" }
fkv_io_compio = { version = "0.1.0", path = "../../io/fkv_io_compio" }
fkv_btree = { version = "0.1.0", path = "../../core/fkv_btree" }
compio = { version = "0.19.2", features = ["runtime", "fs", "io", "macros"] }
gxhash = "3.5"
rusty_alloc_default = "0.1.4"
serde = { version = "1.0.229", features = ["derive"] }
sonic-rs = "0.5.10"
# 迁移时用 cargo add --path ... 添加；先注释掉避免 unused dependency 警告。

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "hash"
harness = false
