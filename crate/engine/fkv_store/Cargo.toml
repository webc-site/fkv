[package]
name = "fkv_store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Store 生命周期、模式派生、路由、fanout"

[dependencies]
fkv_btree = { version = "0.1.0", path = "../../core/fkv_btree" }
fkv_error = { version = "0.1.0", path = "../../foundation/fkv_error" }
fkv_codec = { version = "0.1.0", path = "../../foundation/fkv_codec" }
fkv_compress = { version = "0.1.0", path = "../../format/fkv_compress" }
fkv_io = { version = "0.1.0", path = "../../io/fkv_io" }
fkv_large = { version = "0.1.0", path = "../../core/fkv_large" }
fkv_manifest = { version = "0.1.0", path = "../../format/fkv_manifest" }
fkv_mapping = { version = "0.1.0", path = "../../core/fkv_mapping" }
fkv_recovery = { version = "0.1.0", path = "../fkv_recovery" }
fkv_task_compact = { version = "0.1.0", path = "../fkv_task_compact" }
fkv_task_gc = { version = "0.1.0", path = "../fkv_task_gc" }
fkv_task_read = { version = "0.1.0", path = "../fkv_task_read" }
fkv_task_reopen = { version = "0.1.0", path = "../fkv_task_reopen" }
fkv_task_scan = { version = "0.1.0", path = "../fkv_task_scan" }
fkv_task_write = { version = "0.1.0", path = "../fkv_task_write" }
fkv_types = { version = "0.1.0", path = "../../foundation/fkv_types" }
gxhash = "3.5.0"

[dev-dependencies]
compio = { version = "0.19.2", features = ["macros", "fs", "io"] }
fkv_io_compio = { path = "../../io/fkv_io_compio" }
fkv_io_mem = { path = "../../io/fkv_io_mem" }
pollster = "1.0.1"
# 迁移时用 cargo add --path ... 添加；先注释掉避免 unused dependency 警告。
