[package]
name = "fkv_cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Cloud overlay、cache 预算、term CAS"

[dependencies]
bytes = "1"
fkv_error = { version = "0.1.0", path = "../../foundation/fkv_error" }
fkv_failpoint = { version = "0.1.0", path = "../../foundation/fkv_failpoint" }
fkv_io = { version = "0.1.0", path = "../../io/fkv_io" }
fkv_metrics = { version = "0.1.0", path = "../../foundation/fkv_metrics" }
fkv_object = { version = "0.1.0", path = "../../io/fkv_object" }
fkv_task_reopen = { version = "0.1.0", path = "../fkv_task_reopen" }
fkv_types = { version = "0.1.0", path = "../../foundation/fkv_types" }
futures = "0.3.34"
futures-timer = "3"
gxhash = "3.5.0"
log = { version = "0.4.35", features = ["std"] }

[dev-dependencies]
compio = { version = "0.19.2", features = ["fs", "io", "macros", "time"] }
fkv_btree = { path = "../../core/fkv_btree" }
fkv_io_compio = { path = "../../io/fkv_io_compio" }
fkv_io_mem = { path = "../../io/fkv_io_mem" }
fkv_large = { path = "../../core/fkv_large" }
fkv_object_s3 = { path = "../../io/fkv_object_s3" }
fkv_store = { path = "../fkv_store" }
fkv_testkit = { path = "../../facade/fkv_testkit" }
pollster = "1.0.1"
# 迁移时用 cargo add --path ... 添加；先注释掉避免 unused dependency 警告。
