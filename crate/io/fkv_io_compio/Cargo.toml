[package]
name = "fkv_io_compio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "compio-fs / io_uring 后端"

[dependencies]
compio = { version = "0.19.2", features = ["fs", "io", "macros", "time"] }
fkv_buf = { version = "0.1.0", path = "../../core/fkv_buf" }
fkv_config = { version = "0.1.0", path = "../../foundation/fkv_config" }
fkv_error = { version = "0.1.0", path = "../../foundation/fkv_error" }
fkv_failpoint = { version = "0.1.0", path = "../../foundation/fkv_failpoint" }
fkv_io = { version = "0.1.0", path = "../fkv_io" }
fkv_page = { version = "0.1.0", path = "../../format/fkv_page" }
fkv_types = { version = "0.1.0", path = "../../foundation/fkv_types" }
futures = "0.3"
gxhash = "3.5.0"
itoa = "1.0.18"
libc = "0.2"
log = "0.4"
# 迁移时用 cargo add --path ... 添加；先注释掉避免 unused dependency 警告。

[dev-dependencies]
fkv_testkit = { path = "../../facade/fkv_testkit" }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.15"
