[package]
name = "fkv_object_s3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "S3 SigV4 + ListObjectsV2"

[dependencies]
crossfire = "3.1.22"
fkv_error = { version = "0.1.0", path = "../../foundation/fkv_error" }
fkv_object = { version = "0.1.0", path = "../fkv_object" }
futures = "0.3.34"
futures-channel = "0.3.34"
object_store = { version = "0.14.2", features = ["aws"] }
tokio = { version = "1.54.1", features = ["rt"] }
# 迁移时用 cargo add --path ... 添加；先注释掉避免 unused dependency 警告。
